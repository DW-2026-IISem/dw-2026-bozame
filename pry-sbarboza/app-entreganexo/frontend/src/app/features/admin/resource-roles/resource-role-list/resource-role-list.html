<app-page-header title="Permisos">
  <p-tag [value]="visibleRows().length + ' de ' + rows().length + ' concesiones'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/concesiones-rol'">
    <button pButton (click)="openGrant()"><i class="pi pi-plus" pButtonIcon></i><span pButtonLabel>Conceder permiso</span></button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="card">
  <div class="card-body">
    <p-table
      [value]="visibleRows()"
      [loading]="loading()"
      [paginator]="visibleRows().length > 15"
      [rows]="15"
      dataKey="id"
      [tableStyle]="{ 'min-width': '52rem' }"
    >
      <ng-template #caption pTemplate="caption">
        <div class="flex flex-wrap gap-2">
          <p-select
            [options]="roles()"
            optionLabel="name"
            [showClear]="true"
            placeholder="Filtrar por rol"
            [ngModel]="roleFilter()"
            (ngModelChange)="roleFilter.set($event)"
            styleClass="w-48"
          />
          <input pInputText placeholder="Buscar ruta o método…" [value]="filter()"
                 (input)="filter.set($any($event.target).value)" />
        </div>
      </ng-template>
      <ng-template #header pTemplate="header">
        <tr>
          <th>Rol</th>
          <th class="w-28">Método</th>
          <th>Ruta</th>
          <th>Descripción</th>
          <th class="w-24 text-right">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-row pTemplate="body">
        <tr>
          <td><p-tag [value]="roleName(row)" severity="info" [rounded]="true" /></td>
          <td><p-tag [value]="method(row)" [severity]="methodSeverity(method(row))" [rounded]="true" /></td>
          <td><code class="text-xs text-slate-700">{{ path(row) }}</code></td>
          <td class="text-sm">{{ description(row) || '—' }}</td>
          <td>
            <div class="flex justify-end gap-1">
              <ng-container *appHasPermission="'PATCH /api/concesiones-rol/:id/deactivate'">
                <button pButton text rounded severity="warn"
                        pTooltip="Retirar permiso" (click)="revoke(row)"><i class="pi pi-ban" pButtonIcon></i></button>
              </ng-container>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage pTemplate="emptymessage">
        <tr>
          <td colspan="5">
            <app-empty-state icon="pi pi-shield" title="Sin concesiones" message="Ningún permiso coincide con los filtros." />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  header="Conceder permiso a un rol"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '38rem', maxWidth: '95vw' }"
>
  <div class="space-y-4">
    <div>
      <label for="grant-role" class="field-label">Rol *</label>
      <p-select
        inputId="grant-role"
        [options]="roles()"
        optionLabel="name"
        placeholder="Selecciona un rol"
        [ngModel]="selectedRole()"
        (ngModelChange)="selectedRole.set($event)"
        styleClass="w-full"
        appendTo="body"
      />
    </div>
    <div>
      <label for="grant-resource" class="field-label">Recurso (método + ruta) *</label>
      <p-select
        inputId="grant-resource"
        [options]="resources()"
        [filter]="true"
        filterBy="path,method,description"
        placeholder="Busca la operación"
        [ngModel]="selectedResource()"
        (ngModelChange)="selectedResource.set($event)"
        styleClass="w-full"
        appendTo="body"
      >
        <ng-template #selectedItem let-resource>
          <span class="flex items-center gap-2">
            <p-tag [value]="resource.method" [severity]="methodSeverity(resource.method)" [rounded]="true" />
            <code class="text-xs">{{ resource.path }}</code>
          </span>
        </ng-template>
        <ng-template #item let-resource>
          <span class="flex items-center gap-2">
            <p-tag [value]="resource.method" [severity]="methodSeverity(resource.method)" [rounded]="true" />
            <code class="text-xs">{{ resource.path }}</code>
            <span class="text-xs text-slate-400">{{ resource.description }}</span>
          </span>
        </ng-template>
      </p-select>
    </div>
    <p class="text-xs text-slate-500">
      Si el rol ya tenía la concesión retirada, se reactiva; si está activa, el backend responde 409.
    </p>
    <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
      <button pButton type="button" severity="secondary" outlined (click)="dialogVisible.set(false)"><span pButtonLabel>Cancelar</span></button>
      <button pButton type="button" [disabled]="!canSave()" [loading]="saving()" (click)="grant()"><i class="pi pi-check" pButtonIcon></i><span pButtonLabel>Conceder</span></button>
    </div>
  </div>
</p-dialog>
