<app-page-header title="Recursos" subtitle="Catálogo de operaciones protegibles: cada recurso es un par método + ruta.">
  @for (item of countsByMethod(); track item.method) {
    <p-tag [value]="item.method + ' ' + item.count" [severity]="methodSeverity(item.method)" [rounded]="true" />
  }
  <ng-container *appHasPermission="'POST /api/recursos'">
    <button pButton (click)="openCreate()"><i class="pi pi-plus" pButtonIcon></i><span pButtonLabel>Nuevo recurso</span></button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="card">
  <div class="card-body">
    <p-table
      [value]="visibleRows()"
      [loading]="loading()"
      [paginator]="visibleRows().length > 15"
      [rows]="15"
      dataKey="id"
      [tableStyle]="{ 'min-width': '52rem' }"
    >
      <ng-template #caption pTemplate="caption">
        <div class="flex flex-wrap gap-2">
          <input pInputText placeholder="Buscar ruta o descripción…" [value]="filter()"
                 (input)="filter.set($any($event.target).value)" />
          <p-select
            [options]="methods"
            optionLabel="label"
            optionValue="value"
            [ngModel]="methodFilter()"
            (onChange)="methodFilter.set($event.value)"
            styleClass="w-48"
          />
        </div>
      </ng-template>
      <ng-template #header pTemplate="header">
        <tr>
          <th class="w-28" pSortableColumn="method">Método <p-sort-icon field="method" /></th>
          <th pSortableColumn="path">Ruta <p-sort-icon field="path" /></th>
          <th>Descripción</th>
          <th>Estado</th>
          <th class="w-40 text-right">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-row pTemplate="body">
        <tr>
          <td><p-tag [value]="row.method" [severity]="methodSeverity(row.method)" [rounded]="true" /></td>
          <td><code class="text-xs text-slate-700">{{ row.path }}</code></td>
          <td class="text-sm">{{ row.description || '—' }}</td>
          <td><app-status-tag [status]="row.status" /></td>
          <td>
            <div class="flex justify-end gap-1">
              <ng-container *appHasPermission="'PATCH /api/recursos/:id'">
                <button pButton text rounded severity="secondary" pTooltip="Editar" (click)="openEdit(row)"><i class="pi pi-pencil" pButtonIcon></i></button>
              </ng-container>
              <ng-container *appHasPermission="'PATCH /api/recursos/:id/deactivate'">
                <button pButton text rounded severity="warn" pTooltip="Baja lógica" (click)="deactivate(row)"><i class="pi pi-ban" pButtonIcon></i></button>
              </ng-container>
              <ng-container *appHasPermission="'DELETE /api/recursos/:id'">
                <button pButton text rounded severity="danger" pTooltip="Eliminar" (click)="remove(row)"><i class="pi pi-trash" pButtonIcon></i></button>
              </ng-container>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage pTemplate="emptymessage">
        <tr>
          <td colspan="5">
            <app-empty-state icon="pi pi-sitemap" title="Sin recursos" message="Ningún recurso coincide con el filtro." />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '42rem', maxWidth: '95vw' }"
>
  <app-resource-form [resource]="editing()" [saving]="saving()" (saved)="save($event)" (cancelled)="dialogVisible.set(false)" />
</p-dialog>
