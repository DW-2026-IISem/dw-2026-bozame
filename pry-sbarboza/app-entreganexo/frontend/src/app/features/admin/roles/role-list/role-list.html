<app-page-header title="Roles">
  <p-tag [value]="rows().length + ' roles'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/roles'">
    <button pButton (click)="openCreate()"><i class="pi pi-plus" pButtonIcon></i><span pButtonLabel>Nuevo rol</span></button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="card">
  <div class="card-body">
    <p-table
      [value]="visibleRows()"
      [loading]="loading()"
      [paginator]="visibleRows().length > 10"
      [rows]="10"
      dataKey="id"
      [tableStyle]="{ 'min-width': '48rem' }"
    >
      <ng-template #caption pTemplate="caption">
        <input pInputText placeholder="Buscar rol…" [value]="filter()" (input)="filter.set($any($event.target).value)" />
      </ng-template>
      <ng-template #header pTemplate="header">
        <tr>
          <th pSortableColumn="name">Rol <p-sort-icon field="name" /></th>
          <th>Descripción</th>
          <th>Estado</th>
          <th class="w-40 text-right">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-row pTemplate="body">
        <tr>
          <td>
            <p-tag [value]="row.name" severity="info" [rounded]="true" />
            <p class="mt-1 text-xs text-slate-400">#{{ row.id }}</p>
          </td>
          <td>{{ row.description || '—' }}</td>
          <td><app-status-tag [status]="row.status" /></td>
          <td>
            <div class="flex justify-end gap-1">
              <ng-container *appHasPermission="'PATCH /api/roles/:id'">
                <button pButton text rounded severity="secondary" pTooltip="Editar" (click)="openEdit(row)"><i class="pi pi-pencil" pButtonIcon></i></button>
              </ng-container>
              <ng-container *appHasPermission="'PATCH /api/roles/:id/deactivate'">
                <button pButton text rounded severity="warn" pTooltip="Baja lógica" (click)="deactivate(row)"><i class="pi pi-ban" pButtonIcon></i></button>
              </ng-container>
              <ng-container *appHasPermission="'DELETE /api/roles/:id'">
                <button pButton text rounded severity="danger" pTooltip="Eliminar" (click)="remove(row)"><i class="pi pi-trash" pButtonIcon></i></button>
              </ng-container>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <app-empty-state icon="pi pi-id-card" title="Sin roles" message="Crea el primero usando el botón superior." />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '38rem', maxWidth: '95vw' }"
>
  <app-role-form [role]="editing()" [saving]="saving()" (saved)="save($event)" (cancelled)="dialogVisible.set(false)" />
</p-dialog>
